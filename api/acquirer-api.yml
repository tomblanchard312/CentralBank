openapi: 3.1.0
info:
  title: CentralBank CBDT Acquirer API
  version: 1.1.0
  description: >
    Acquirer and processor integration API for the CentralBank Digital Token Protocol.
    The API supports authorization, capture, reversal, refund, reconciliation, and
    offline advice. The core API is denomination-neutral; deployment profiles define
    permitted currency codes and policy parameters. All mutating endpoints require
    idempotency and detached JWS over the canonical JSON request body.
  contact:
    name: CentralBank Reference Implementation Team
  license:
    name: See repository LICENSE
  x-project-status: independent-reference-implementation
  x-non-affiliation: >
    CentralBank is an independent reference implementation. It is not issued,
    endorsed, sponsored, or operated by the ECB, the Eurosystem, or any national
    central bank.
servers:
  - url: https://gateway.centralbank.example.internal
    description: Closed Settlement Plane example endpoint. Replace per deployment.
security:
  - mTLS: []
tags:
  - name: Transactions
  - name: Reconciliation
  - name: Offline
x-centralbank:
  protocol: CentralBank Digital Token Protocol
  token_name: Central Bank Digital Token
  token_symbol: CBDT
  profile: deployment-defined
x-security:
  mtls_required: true
  detached_jws_required: true
  notes:
    - Use mutual TLS with client certificates issued by the deployment's closed-plane PKI.
    - Use detached JWS over a canonical JSON representation of the request body.
    - Do not include secrets, signing material, wallet credentials, or raw sensitive payloads in logs.
paths:
  /v1/transactions/authorize:
    post:
      tags: [Transactions]
      summary: Authorize a CBDT payment
      operationId: authorizeTransaction
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/XRequestId'
        - $ref: '#/components/parameters/XAcquirerId'
        - $ref: '#/components/parameters/XMerchantId'
        - $ref: '#/components/parameters/XTerminalId'
        - $ref: '#/components/parameters/XJwsSignature'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthorizeRequest'
            examples:
              eurosystemReference:
                summary: EUR example using the eurosystem-reference profile
                value:
                  amount: { value: "12.34", currency: "EUR" }
                  merchant: { merchant_id: "m_123", category_code: "5411" }
                  terminal: { terminal_id: "t_456", capabilities: ["NFC", "CHIP", "OFFLINE"] }
                  payer:
                    instrument_type: "CBDT_WALLET"
                    wallet_token: "opaque_token"
                  risk:
                    device_attestation: "opaque_attestation"
                    offline_eligible: true
                  metadata:
                    local_txn_time_utc: "2026-09-08T15:00:00Z"
      responses:
        '200': { description: Authorization decision, content: { application/json: { schema: { $ref: '#/components/schemas/AuthorizeResponse' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalError' }
  /v1/transactions/{txn_id}/capture:
    post:
      tags: [Transactions]
      summary: Capture a previously authorized transaction
      operationId: captureTransaction
      parameters:
        - $ref: '#/components/parameters/TxnId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/XRequestId'
        - $ref: '#/components/parameters/XAcquirerId'
        - $ref: '#/components/parameters/XMerchantId'
        - $ref: '#/components/parameters/XTerminalId'
        - $ref: '#/components/parameters/XJwsSignature'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CaptureRequest' }
      responses:
        '200': { description: Capture result, content: { application/json: { schema: { $ref: '#/components/schemas/TxnStatusResponse' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalError' }
  /v1/transactions/{txn_id}/reverse:
    post:
      tags: [Transactions]
      summary: Reverse an authorization before capture
      operationId: reverseTransaction
      parameters:
        - $ref: '#/components/parameters/TxnId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/XRequestId'
        - $ref: '#/components/parameters/XAcquirerId'
        - $ref: '#/components/parameters/XMerchantId'
        - $ref: '#/components/parameters/XTerminalId'
        - $ref: '#/components/parameters/XJwsSignature'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReverseRequest' }
      responses:
        '200': { description: Reversal result, content: { application/json: { schema: { $ref: '#/components/schemas/TxnStatusResponse' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalError' }
  /v1/transactions/{txn_id}/refund:
    post:
      tags: [Transactions]
      summary: Refund a captured transaction
      operationId: refundTransaction
      parameters:
        - $ref: '#/components/parameters/TxnId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/XRequestId'
        - $ref: '#/components/parameters/XAcquirerId'
        - $ref: '#/components/parameters/XMerchantId'
        - $ref: '#/components/parameters/XTerminalId'
        - $ref: '#/components/parameters/XJwsSignature'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RefundRequest' }
      responses:
        '200': { description: Refund result, content: { application/json: { schema: { $ref: '#/components/schemas/TxnStatusResponse' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalError' }
  /v1/reconciliation/batches/{batch_id}:
    get:
      tags: [Reconciliation]
      summary: Get reconciliation details for a batch
      operationId: getReconciliationBatch
      parameters:
        - $ref: '#/components/parameters/BatchId'
        - $ref: '#/components/parameters/XRequestId'
        - $ref: '#/components/parameters/XAcquirerId'
      responses:
        '200': { description: Batch reconciliation response, content: { application/json: { schema: { $ref: '#/components/schemas/ReconciliationBatchResponse' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalError' }
  /v1/offline/advice:
    post:
      tags: [Offline]
      summary: Submit an offline CBDT advice batch for later clearing
      description: >
        Submits offline-approved transactions for verification of signatures,
        anti-replay counters, profile limits, and transfer policy. Acceptance of
        offline payments and applicable limits are deployment-profile decisions.
      operationId: submitOfflineAdvice
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/XRequestId'
        - $ref: '#/components/parameters/XAcquirerId'
        - $ref: '#/components/parameters/XJwsSignature'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OfflineAdviceBatchRequest' }
      responses:
        '200': { description: Offline advice batch results, content: { application/json: { schema: { $ref: '#/components/schemas/OfflineAdviceBatchResponse' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalError' }
components:
  securitySchemes:
    mTLS:
      type: mutualTLS
      description: Mutual TLS using the deployment's closed-plane PKI.
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: { type: string, minLength: 8, maxLength: 128 }
      description: Unique key used to guarantee idempotent request processing.
    XRequestId:
      name: X-Request-Id
      in: header
      required: true
      schema: { type: string, format: uuid }
      description: Correlation identifier for end-to-end tracing.
    XAcquirerId:
      name: X-Acquirer-Id
      in: header
      required: true
      schema: { type: string, minLength: 3, maxLength: 64 }
      description: Acquirer or processor identifier assigned by deployment governance.
    XMerchantId:
      name: X-Merchant-Id
      in: header
      required: false
      schema: { type: string, minLength: 1, maxLength: 128 }
    XTerminalId:
      name: X-Terminal-Id
      in: header
      required: false
      schema: { type: string, minLength: 1, maxLength: 128 }
    XJwsSignature:
      name: X-JWS-Signature
      in: header
      required: true
      schema: { type: string, minLength: 40, maxLength: 4096 }
      description: Detached JWS signature over the canonical JSON body.
    TxnId:
      name: txn_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    BatchId:
      name: batch_id
      in: path
      required: true
      schema: { type: string, minLength: 3, maxLength: 128 }
  responses:
    BadRequest: { description: Request validation failed, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
    Unauthorized: { description: Authentication failed, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
    Forbidden: { description: Not authorized by policy, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
    NotFound: { description: Resource not found, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
    Conflict: { description: Idempotency conflict or invalid state transition, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
    TooManyRequests: { description: Rate limited or throttled, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
    InternalError: { description: Unexpected server error, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
  schemas:
    Money:
      type: object
      additionalProperties: false
      required: [value, currency]
      properties:
        value:
          type: string
          pattern: '^[0-9]+(\.[0-9]{2})$'
          description: Decimal string with two fractional digits for the reference implementation.
        currency:
          type: string
          pattern: '^[A-Z]{3}$'
          description: ISO 4217 currency code permitted by the active deployment profile. The eurosystem-reference profile uses EUR.
    Merchant:
      type: object
      additionalProperties: false
      required: [merchant_id, category_code]
      properties:
        merchant_id: { type: string, minLength: 1, maxLength: 128 }
        category_code: { type: string, pattern: '^[0-9]{4}$' }
    Terminal:
      type: object
      additionalProperties: false
      required: [terminal_id, capabilities]
      properties:
        terminal_id: { type: string, minLength: 1, maxLength: 128 }
        capabilities:
          type: array
          minItems: 1
          maxItems: 16
          items: { type: string, enum: [NFC, CHIP, MAGSTRIPE, OFFLINE] }
    Payer:
      type: object
      additionalProperties: false
      required: [instrument_type, wallet_token]
      properties:
        instrument_type: { type: string, enum: [CBDT_WALLET] }
        wallet_token:
          type: string
          minLength: 8
          maxLength: 4096
          description: Opaque payer-instrument token. It must not contain PII or signing material.
    Risk:
      type: object
      additionalProperties: false
      required: [offline_eligible]
      properties:
        device_attestation: { type: string, minLength: 0, maxLength: 8192 }
        offline_eligible: { type: boolean }
    Metadata:
      type: object
      additionalProperties: false
      required: [local_txn_time_utc]
      properties:
        local_txn_time_utc: { type: string, format: date-time }
    AuthorizeRequest:
      type: object
      additionalProperties: false
      required: [amount, merchant, terminal, payer, risk, metadata]
      properties:
        amount: { $ref: '#/components/schemas/Money' }
        merchant: { $ref: '#/components/schemas/Merchant' }
        terminal: { $ref: '#/components/schemas/Terminal' }
        payer: { $ref: '#/components/schemas/Payer' }
        risk: { $ref: '#/components/schemas/Risk' }
        metadata: { $ref: '#/components/schemas/Metadata' }
    AuthorizeResponse:
      type: object
      additionalProperties: false
      required: [auth, ledger]
      properties:
        auth:
          type: object
          additionalProperties: false
          required: [decision, auth_code, expires_at_utc]
          properties:
            decision: { type: string, enum: [APPROVED, DECLINED, PARTIAL_OFFLINE_APPROVED] }
            auth_code: { type: string, minLength: 2, maxLength: 64 }
            expires_at_utc: { type: string, format: date-time }
        ledger:
          type: object
          additionalProperties: false
          required: [txn_id, status]
          properties:
            txn_id: { type: string, format: uuid }
            status: { type: string, enum: [AUTHORIZED, DECLINED] }
    CaptureRequest:
      type: object
      additionalProperties: false
      required: [capture_amount, batch]
      properties:
        capture_amount: { $ref: '#/components/schemas/Money' }
        batch:
          type: object
          additionalProperties: false
          required: [batch_id]
          properties:
            batch_id: { type: string, minLength: 3, maxLength: 128 }
    ReverseRequest:
      type: object
      additionalProperties: false
      required: [reason_code]
      properties:
        reason_code: { type: string, enum: [CUSTOMER_CANCELLED, DUPLICATE, MERCHANT_ERROR, TIMEOUT] }
    RefundRequest:
      type: object
      additionalProperties: false
      required: [refund_amount, reason_code]
      properties:
        refund_amount: { $ref: '#/components/schemas/Money' }
        reason_code: { type: string, enum: [RETURNED_GOODS, SERVICE_NOT_PROVIDED, MERCHANT_DISCRETION, OTHER] }
    TxnStatusResponse:
      type: object
      additionalProperties: false
      required: [txn_id, status]
      properties:
        txn_id: { type: string, format: uuid }
        status: { type: string, enum: [CAPTURED, REVERSED, REFUNDED] }
        clearing_ref: { type: string, maxLength: 128 }
    ReconciliationBatchResponse:
      type: object
      additionalProperties: false
      required: [batch_id, totals, items]
      properties:
        batch_id: { type: string }
        totals:
          type: object
          additionalProperties: false
          required: [count, amount]
          properties:
            count: { type: integer, minimum: 0 }
            amount: { $ref: '#/components/schemas/Money' }
        items:
          type: array
          maxItems: 5000
          items:
            type: object
            additionalProperties: false
            required: [txn_id, status]
            properties:
              txn_id: { type: string, format: uuid }
              status: { type: string, enum: [CAPTURED, REJECTED, PENDING] }
              reason: { type: string, maxLength: 256 }
    OfflineAdviceItem:
      type: object
      additionalProperties: false
      required: [merchant_id, terminal_id, amount, offline_token, local_time_utc, sequence]
      properties:
        merchant_id: { type: string, minLength: 1, maxLength: 128 }
        terminal_id: { type: string, minLength: 1, maxLength: 128 }
        amount: { $ref: '#/components/schemas/Money' }
        offline_token:
          type: string
          minLength: 20
          maxLength: 16384
          description: Signed offline spend token produced by the wallet and opaque to the acquirer.
        local_time_utc: { type: string, format: date-time }
        sequence: { type: integer, minimum: 0 }
    OfflineAdviceBatchRequest:
      type: object
      additionalProperties: false
      required: [batch_id, submitted_at_utc, items]
      properties:
        batch_id: { type: string, minLength: 3, maxLength: 128 }
        submitted_at_utc: { type: string, format: date-time }
        items:
          type: array
          minItems: 1
          maxItems: 2000
          items: { $ref: '#/components/schemas/OfflineAdviceItem' }
    OfflineAdviceResultItem:
      type: object
      additionalProperties: false
      required: [index, decision]
      properties:
        index: { type: integer, minimum: 0 }
        decision: { type: string, enum: [ACCEPTED, REJECTED, PENDING_REVIEW] }
        txn_id: { type: string, format: uuid }
        reason_code:
          type: string
          enum: [OK, INVALID_SIGNATURE, REPLAY_DETECTED, OFFLINE_LIMIT_EXCEEDED, POLICY_BLOCKED, EXPIRED, UNKNOWN_WALLET_KEY, MALFORMED_TOKEN]
    OfflineAdviceBatchResponse:
      type: object
      additionalProperties: false
      required: [batch_id, accepted, rejected, results]
      properties:
        batch_id: { type: string }
        accepted: { type: integer, minimum: 0 }
        rejected: { type: integer, minimum: 0 }
        results:
          type: array
          items: { $ref: '#/components/schemas/OfflineAdviceResultItem' }
    ErrorResponse:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code, message, retryable, correlation_id]
          properties:
            code:
              type: string
              enum: [INVALID_REQUEST, INVALID_SIGNATURE, UNAUTHORIZED_ACQUIRER, POLICY_BLOCKED, INSUFFICIENT_FUNDS, SUSPECTED_FRAUD, INVALID_STATE, IDEMPOTENCY_CONFLICT, NOT_FOUND, RATE_LIMITED, NETWORK_DEGRADED, INTERNAL_ERROR]
            message: { type: string, maxLength: 512 }
            retryable: { type: boolean }
            correlation_id: { type: string, format: uuid }
