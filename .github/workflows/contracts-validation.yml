name: Contracts Build and Validation

on:
  pull_request:
    paths:
      - 'contracts/**'
      - '.github/workflows/contracts-validation.yml'
  push:
    branches: [main]
    paths:
      - 'contracts/**'
      - '.github/workflows/contracts-validation.yml'

permissions:
  contents: read

concurrency:
  group: contracts-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: contracts
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.7.1

      - name: Check formatting of changed Solidity files
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            base_sha="${{ github.event.pull_request.base.sha }}"
            files=$(git diff --name-only --diff-filter=ACMR "$base_sha" HEAD -- '*.sol' | sed 's#^contracts/##' | grep -v '^lib/' || true)
          else
            files=$(git diff --name-only --diff-filter=ACMR HEAD^ HEAD -- '*.sol' | sed 's#^contracts/##' | grep -v '^lib/' || true)
          fi

          if [[ -z "$files" ]]; then
            echo "No changed Solidity files to format-check."
            exit 0
          fi

          echo "Checking Foundry formatting for:"
          echo "$files"
          # shellcheck disable=SC2086
          forge fmt --check $files

      - name: Build contracts
        run: forge build --sizes

      - name: Run unit and fuzz tests
        run: forge test -vvv

      - name: Run invariant suite
        run: forge test --match-contract DigitalTokenInvariantTest -vvv
        env:
          FOUNDRY_PROFILE: ci
