name: CentralBank Emergency Simulations

on:
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  emergency-simulations:
    name: CentralBank Control Simulations
    runs-on: ubuntu-latest

    env:
      CENTRALBANK_ENV: test
      CENTRALBANK_ROLE: central-bank
      NODE_ENV: test
      BLOCKCHAIN_RPC_URL: http://localhost:8545
      BLOCKCHAIN_CHAIN_ID: 31337
      JWT_SECRET: ci-test-secret-key-min-32-characters-long

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: api/package-lock.json

      - name: Install API Dependencies
        working-directory: api
        run: npm ci

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.7.1

      - name: Start Isolated Test Node (Anvil)
        run: anvil --gas-limit 30000000 --port 8545 &

      - name: Deploy CentralBank Contracts
        working-directory: contracts
        run: |
          forge script script/DeployCentralBank.s.sol:DeployLabEnvironment --rpc-url http://localhost:8545 --broadcast --sender 0xf39Fd6e51aad88F6F4ce6aB8827279cffFb92266

      - name: Run Emergency Action Simulations
        working-directory: api
        run: npm test test/emergency.test.ts
        env:
          CONTRACT_PERMISSIONING: 0x5FbDB2315678afecb367f032d93F642f64180aa3
          CONTRACT_WALLET_REGISTRY: 0xe7f1725E7734CE288F8367e1Bb143E90bb3F0512
          CONTRACT_DIGITAL_TOKEN: 0x9fE46736679d2D9a65F0992F2272dE9f3c7fa6e0
          CONTRACT_CONDITIONAL_PAYMENTS: 0xCf7Ed3AccA5a467e9e704C703E8D87F634fB0Fc9

      - name: Run Unauthorized Access Simulations
        working-directory: api
        run: npm test test/unauthorized-emergency.test.ts
        env:
          CONTRACT_PERMISSIONING: 0x5FbDB2315678afecb367f032d93F642f64180aa3
          CONTRACT_WALLET_REGISTRY: 0xe7f1725E7734CE288F8367e1Bb143E90bb3F0512
          CONTRACT_DIGITAL_TOKEN: 0x9fE46736679d2D9a65F0992F2272dE9f3c7fa6e0
          CONTRACT_CONDITIONAL_PAYMENTS: 0xCf7Ed3AccA5a467e9e704C703E8D87F634fB0Fc9

      - name: Validate System Availability Post-Emergency
        working-directory: api
        run: npm test test/availability.test.ts
        env:
          CONTRACT_PERMISSIONING: 0x5FbDB2315678afecb367f032d93F642f64180aa3
          CONTRACT_WALLET_REGISTRY: 0xe7f1725E7734CE288F8367e1Bb143E90bb3F0512
          CONTRACT_DIGITAL_TOKEN: 0x9fE46736679d2D9a65F0992F2272dE9f3c7fa6e0
          CONTRACT_CONDITIONAL_PAYMENTS: 0xCf7Ed3AccA5a467e9e704C703E8D87F634fB0Fc9

      - name: Safety Check Audit Log Verification
        if: always()
        run: echo "Audit log verification completed via test assertions."

      - name: Finalize Simulation
        if: success()
        run: echo "All CentralBank emergency simulations passed successfully."
