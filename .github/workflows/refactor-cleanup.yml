name: Final CentralBank Refactor Cleanup

on:
  push:
    branches:
      - refactor/centralbank-cbdt
    paths:
      - '.github/workflows/refactor-cleanup.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/centralbank-cbdt
          fetch-depth: 0

      - name: Apply exact cleanup
        shell: python
        run: |
          from pathlib import Path

          path = Path('api/src/services/blockchain.ts')
          text = path.read_text()

          old = "  ECB_ROLE: ethers.keccak256(ethers.toUtf8Bytes('ECB_ROLE')),"
          new = "  CENTRAL_BANK_ROLE: ethers.keccak256(ethers.toUtf8Bytes('CENTRAL_BANK_ROLE')) ,".replace(')) ,', ')),')
          if old not in text:
              raise SystemExit('Expected ECB_ROLE block not found')
          text = text.replace(old, new)

          old = """  async isECB(account: string): Promise<boolean> {
            const func = this._permissioning.getFunction('isECB');
            if (!func) throw new BlockchainError('Contract method isECB not available');
            return await func(account) as boolean;
          }"""
          new = """  async isCentralBank(account: string): Promise<boolean> {
            const func = this._permissioning.getFunction('isCentralBank');
            if (!func) throw new BlockchainError('Contract method isCentralBank not available');
            return await func(account) as boolean;
          }"""
          if old not in text:
              raise SystemExit('Expected isECB block not found')
          text = text.replace(old, new)

          old = """  async mint(to: string, amount: bigint, justification: string, idempotencyKey: string, correlationId?: string, userId?: string) {
            await this.validateHoldingLimit(to, amount);

            await logAuditEvent({
              action: 'TOKENS_MINTED',
              actor: userId || 'system',
              resource: 'token',
              resourceId: to,
              details: { justification, amount: amount.toString(), idempotencyKey },
              result: 'success',
            });

            return this.executeTransaction(
              this._digitalToken,
              'mint',
              [to, amount, this._toBytes32Key(idempotencyKey)],
              {
                ...(correlationId && { correlationId }),
                ...(userId && { userId }),
                operation: 'MINT_TOKENS'
              }
            );
          }"""
          new = """  async mint(to: string, amount: bigint, justification: string, idempotencyKey: string, correlationId?: string, userId?: string) {
            await this.validateHoldingLimit(to, amount);

            await logAuditEvent({
              action: 'TOKENS_MINT_REQUESTED',
              actor: userId || 'system',
              resource: 'token',
              resourceId: to,
              details: { justification, amount: amount.toString(), idempotencyKey },
              result: 'success',
            });

            const transaction = await this.executeTransaction(
              this._digitalToken,
              'mint',
              [to, amount, this._toBytes32Key(idempotencyKey)],
              {
                ...(correlationId && { correlationId }),
                ...(userId && { userId }),
                operation: 'MINT_TOKENS'
              }
            );

            await logAuditEvent({
              action: 'TOKENS_MINTED',
              actor: userId || 'system',
              resource: 'token',
              resourceId: to,
              details: {
                justification,
                amount: amount.toString(),
                idempotencyKey,
                txHash: transaction.txHash,
                blockNumber: transaction.blockNumber,
              },
              result: 'success',
            });

            return transaction;
          }"""
          if old not in text:
              raise SystemExit('Expected mint audit block not found; refusing broad edit')
          text = text.replace(old, new)
          path.write_text(text)

      - name: Commit cleanup
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo 'No cleanup changes needed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add api/src/services/blockchain.ts
          git commit -m 'refactor: finish generic authority and mint audit cleanup'
          git push origin HEAD:refactor/centralbank-cbdt
